name: OpenWiki Update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: [self-hosted, homelab]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # This runner is self-hosted with a persistent, git-tracked
          # ~/.gitconfig (symlinked into deanjstone/argus-config). checkout's
          # default safe.directory write is unconditional (git config
          # --global --add on every run, no existence check), so it
          # duplicates a line in that tracked file on every scheduled run.
          # A one-time `git config --global --add safe.directory '*'` on the
          # runner already covers this repo, so disable the per-run write.
          set-safe-directory: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build OpenWiki
        run: pnpm run build

      - name: Run OpenWiki
        run: node dist/cli.js code --update --print
        env:
          # claude-cli is fully keyless: spawns the operator's already
          # authenticated `claude` CLI on this self-hosted runner instead of
          # calling a hosted API. No API key secrets needed.
          OPENWIKI_PROVIDER: claude-cli
          OPENWIKI_TELEMETRY_DISABLED: "1"

      - name: Classify update as structural or routine
        id: classify
        run: |
          set -euo pipefail
          # The workflow file itself must never be silently auto-merged.
          if ! git diff --quiet -- .github/workflows/openwiki-update.yml; then
            echo "classification=structural" >> "$GITHUB_OUTPUT"
            echo "reason=workflow file changed" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git status --porcelain -- openwiki | grep -qE '^(\?\?|A)'; then
            echo "classification=structural" >> "$GITHUB_OUTPUT"
            echo "reason=new file(s) under openwiki/" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          diff_output="$(git diff -- openwiki)"
          if echo "$diff_output" | grep -qE '^\+#{2,3} '; then
            echo "classification=structural" >> "$GITHUB_OUTPUT"
            echo "reason=new heading added" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if echo "$diff_output" | grep -qE '^\+.*\[.+\]\(.+\)'; then
            echo "classification=structural" >> "$GITHUB_OUTPUT"
            echo "reason=markdown link changed" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "classification=routine" >> "$GITHUB_OUTPUT"
          echo "reason=prose-only content update" >> "$GITHUB_OUTPUT"

      - name: Create OpenWiki update pull request
        id: pr
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          add-paths: |
            openwiki
            AGENTS.md
            CLAUDE.md
            .github/workflows/openwiki-update.yml
          branch: openwiki/update
          commit-message: "docs: update OpenWiki"
          title: "docs: update OpenWiki"
          body: |
            Automated OpenWiki documentation update.

            This PR was generated by the scheduled OpenWiki workflow.

            Classification: ${{ steps.classify.outputs.classification }} (${{ steps.classify.outputs.reason }})

      - name: Auto-merge routine updates
        if: steps.classify.outputs.classification == 'routine' && steps.pr.outputs.pull-request-number
        run: gh pr merge --auto --squash "${{ steps.pr.outputs.pull-request-number }}"
        env:
          GH_TOKEN: ${{ github.token }}
